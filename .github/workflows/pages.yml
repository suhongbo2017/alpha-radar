name: Build and Deploy Alpha Radar site

# [D-75] CI 只做两件事：**调用与本地相同的构建脚本** + **上传产物**。
# 所有验证逻辑都在 scripts/pages_build.py 里 —— 本地跑它通过，CI 必通过，
# 因此本地预览不需要 push 后去 Actions 检查。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 与本地完全相同的命令（--with-gates 会跑全部 10 道门禁）
      # [D-97] 失败时把尾部日志打成 GitHub annotation：
      #   之前每次 CI 红都只能看到“过程已以退出码 1 结束”，要查原因得登录看 job log。
      #   annotation 可以通过 API / 提交页直接读到 —— 不让“看不到原因”成为常态。
      - name: Build + verify（与本地同一脚本）
        run: |
          set -o pipefail
          python3 scripts/pages_build.py --with-gates --strict 2>&1 | tee /tmp/build.log || {
            echo "::error::pages_build 失败，尾部 25 行（完整日志见 Job log）"
            tail -25 /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4