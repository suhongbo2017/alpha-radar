<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Radar · 研究工作台</title>
<style>
:root{--bg:#f4f1e9;--ink:#18211f;--muted:#5e6b67;--line:#c9d0c8;--paper:#fffdf8;--accent:#d24d2f;--green:#176b55;--blue:#155d82;--fs:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.55 Georgia,"Microsoft YaHei",serif}main{max-width:1120px;margin:0 auto;padding:36px 24px 72px}header{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:26px;display:flex;justify-content:space-between;gap:24px;align-items:end}h1,h2,p{margin-top:0}h1{font-size:clamp(2rem,4vw,3.5rem);line-height:1.02;margin-bottom:10px;letter-spacing:0}h2{font-size:1.45rem;margin-bottom:14px}.kicker{font:700 .78rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}.lede{max-width:700px;color:var(--muted);font-size:1.05rem}.badge{border:1px solid var(--ink);padding:9px 12px;font:700 .78rem ui-monospace,Consolas,monospace;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(300px,390px 1fr);grid-template-columns:390px 1fr;gap:22px}.panel{background:var(--paper);border:1px solid var(--line);padding:24px;box-shadow:4px 4px 0 #d8d2c5}label{display:block;font-weight:700;margin:15px 0 6px}input[type=text]{width:100%;font:700 1.3rem ui-monospace,Consolas,monospace;padding:11px;border:2px solid var(--ink);background:#fff}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:700;margin-bottom:8px}.check{display:flex;align-items:flex-start;gap:9px;margin:9px 0;font-size:.95rem}.check input{width:19px;height:19px;accent-color:var(--accent)}button{border:0;background:var(--accent);color:#fff;font:700 1rem Georgia,"Microsoft YaHei",serif;padding:13px 18px;cursor:pointer}button:hover,button:focus-visible{background:#a93220;outline:3px solid #f0ab3c;outline-offset:2px}button:disabled{background:#9b9a91;cursor:wait}.notice{font-size:.88rem;color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}.status{font:700 1rem ui-monospace,Consolas,monospace;color:var(--blue);margin-bottom:12px}.stage{display:flex;gap:12px;border-top:1px solid var(--line);padding:11px 0}.stage b{min-width:98px}.stage.ok b{color:var(--green)}.stage.fail b{color:var(--accent)}pre{white-space:pre-wrap;word-break:break-word;background:#202927;color:#eaf1e8;padding:15px;max-height:360px;overflow:auto;font:.82rem/1.45 ui-monospace,Consolas,monospace}.links a{color:var(--blue);font-weight:700}.empty{color:var(--muted)}@media(max-width:800px){main{padding:24px 16px}.grid{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:12px}}
</style>
</head>
<body><main>
<header><div><div class="kicker">Alpha Radar / Local Research Desk</div><h1>研究工作台</h1><p class="lede">从浏览器启动数据准备流程，查看校验结果，并把机器粗筛交接给人工研究。正式估值、预测和组合决策仍需完成研究档案后单独登记。</p></div><div class="badge">LOCAL ONLY · 127.0.0.1</div></header>
<div class="grid"><section class="panel"><h2>启动准备流程</h2><form id="form"><label for="ticker">股票代码</label><input id="ticker" name="ticker" type="text" placeholder="例如 NVDA" maxlength="10" required pattern="[A-Za-z][A-Za-z0-9.\-]{0,9}" autocomplete="off"><fieldset><legend>运行选项</legend><label class="check"><input type="checkbox" name="force"> 强制刷新 SEC 原始数据</label><label class="check"><input type="checkbox" name="offline"> 离线模式，仅使用本地行情缓存</label><label class="check"><input type="checkbox" name="no-cross"> 跳过外部交叉校验</label><label class="check"><input type="checkbox" name="no-report"> 不生成运行报告</label><label class="check"><input type="checkbox" name="no-draft"> 不生成研究草稿</label></fieldset><button id="start" type="submit">启动数据准备</button></form><p class="notice">规则情景只是低置信度筛选，不等于 Fair Value。页面不会写入正式预测、估值或投资决策。</p></section>
<section class="panel"><h2>运行状态</h2><div id="status" class="status">等待启动</div><div id="stages" class="empty">输入 ticker 后启动一个本地任务。</div><div id="links" class="links"></div><h2 style="margin-top:26px">终端输出</h2><pre id="output">暂无输出</pre></section></div>
</main><script>
const form=document.querySelector('#form'),start=document.querySelector('#start'),status=document.querySelector('#status'),stages=document.querySelector('#stages'),links=document.querySelector('#links'),output=document.querySelector('#output');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(job){status.textContent=`${job.ticker} · ${job.status}${job.returncode===0?' · 已完成':''}`;output.textContent=job.output||'等待阶段输出…';if(job.command)output.textContent+=`\n\n命令：${job.command.join(' ')}`;if(job.status==='completed'||job.status==='failed'){start.disabled=false;const lines=(job.output||'').split('\n').filter(x=>x.trim());stages.innerHTML=lines.filter(x=>/通过|失败|跳过|状态：/.test(x)).map(x=>`<div class="stage ${x.includes('失败')?'fail':'ok'}"><b>${x.includes('失败')?'注意':'阶段'}</b><span>${esc(x.trim())}</span></div>`).join('')||'<div class="empty">流程已结束，详细内容见运行报告。</div>';links.innerHTML='<p>详细 JSON、Markdown 报告和研究草稿保存在项目的 <code>data/runs/</code> 目录。</p>';}else{stages.innerHTML='<div class="stage"><b>运行中</b><span>正在执行 SEC、行情、指标、校验和规则筛选阶段…</span></div>';}}
async function poll(id){const r=await fetch('/api/jobs/'+id);const job=await r.json();if(!r.ok){status.textContent=job.error;start.disabled=false;return}draw(job);if(job.status==='queued'||job.status==='running')setTimeout(()=>poll(id),700)}
form.addEventListener('submit',async e=>{e.preventDefault();start.disabled=true;links.innerHTML='';stages.textContent='任务排队中…';const body={};new FormData(form).forEach((v,k)=>body[k]=k==='ticker'?v:true);body.ticker=body.ticker.trim().toUpperCase();const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const job=await r.json();if(!r.ok){status.textContent=job.error;start.disabled=false;return}poll(job.id)});
</script></body></html>
